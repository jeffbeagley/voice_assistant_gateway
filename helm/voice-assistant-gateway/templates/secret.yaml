{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "voice-assistant-gateway.fullname" . }}
  labels:
    {{- include "voice-assistant-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  GATEWAY_VLLM_API_KEY: {{ .Values.config.vllm.apiKey | quote }}
{{- end }}
